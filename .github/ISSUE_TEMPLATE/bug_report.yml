name: Bug report
description: Something did not convert correctly, or rpt2frx failed to run
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not attach confidential reports. A screenshot with the data hidden is enough."
  - type: input
    id: version
    attributes:
      label: Output of `rpt2frx --version`
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rpt2frx doctor`
      render: text
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What did you do, what did you expect, what happened?
    validations: { required: true }
  - type: textarea
    id: warnings
    attributes:
      label: Warnings printed after the conversion (if any)
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or the newest log file from %LOCALAPPDATA%\CrystalMetadata\logs
